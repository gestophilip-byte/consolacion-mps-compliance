name: Update Citation Monitoring summary

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_citation_summary.py"
      - ".github/workflows/update-citation-summary.yml"

permissions:
  contents: write

concurrency:
  group: citation-monitoring-summary
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests openpyxl

      - name: Recalculate complete workbook
        run: python scripts/update_citation_summary.py

      - name: Commit if totals changed
        run: |
          set -euo pipefail

          # A fresh calculation always gets a new calculatedAt timestamp.
          # Compare the actual totals/counts without that timestamp so the
          # repository is not committed every 15 minutes when nothing changed.
          if git show HEAD:citation-summary.json 2>/dev/null | jq 'del(.calculatedAt)' > old-summary.json; then
            jq 'del(.calculatedAt)' citation-summary.json > new-summary.json
            if cmp -s old-summary.json new-summary.json; then
              echo "Citation Monitoring totals are unchanged."
              git checkout -- citation-summary.json
              rm -f old-summary.json new-summary.json
              exit 0
            fi
            rm -f old-summary.json new-summary.json
          fi

          git config user.name "citation-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add citation-summary.json
          git commit -m "chore: refresh Citation Monitoring summary"
          git push
