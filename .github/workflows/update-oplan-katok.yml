# Manual verification for the public Oplan Katok firearm aggregate file.
# The previous hourly endpoint sync was retired on 1 September 2026 so it
# cannot overwrite the cleaned Consolacion firearm summary with legacy totals.

name: Verify Oplan Katok firearm summary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate aggregate-only dataset
        run: |
          set -euo pipefail

          jq -e '
            (.masterRecords | type == "number") and
            (.uniqueSerials | type == "number") and
            (.individuals | type == "number") and
            (.smallArms | type == "number") and
            (.lightWeapons | type == "number") and
            (.duplicateSerialGroups | type == "number") and
            (.firearmTypes | type == "object") and
            (.kinds | type == "object") and
            (.firearmsStatus | type == "object") and
            (.expiryStatus | type == "object") and
            (.barangays | type == "object") and
            (.privacy | type == "string")
          ' oplan-katok-summary.json > /dev/null

          # Guardrail: personally identifiable owner fields must not be present
          # in the public aggregate JSON.
          if jq -e 'has("owners") or has("serialNumbers") or has("birthDates") or has("addresses")' oplan-katok-summary.json > /dev/null; then
            echo "::error::Public Katok summary contains a prohibited owner-level field."
            exit 1
          fi

          echo "Oplan Katok aggregate file is valid."
          jq '{
            masterRecords,
            uniqueSerials,
            individuals,
            smallArms,
            lightWeapons,
            duplicateSerialGroups,
            kinds,
            firearmsStatus,
            expiryStatus
          }' oplan-katok-summary.json >> "$GITHUB_STEP_SUMMARY"
